<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karang Taruna Pandu Muda Sawahan 5 - Pandawa Lima</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2', 100: '#ffe4e6', 500: '#f43f5e', 600: '#e11d48',
                            700: '#be123c', 800: '#9f1239', 900: '#881337', neon: '#ff003c',
                            dark: '#0a0a0c', card: '#121216', border: '#27272a', gold: '#fbbf24'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0c; color: #f4f4f5; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0c; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        .glass-card { background: rgba(18, 18, 22, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gradient-text { background: linear-gradient(135deg, #ffffff 0%, #ff4d6d 50%, #ff003c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .badge-pulse { animation: pulse-red 2s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 0, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0); }
        }
    </style>
</head>
<body class="min-h-screen bg-brand-dark text-gray-100 flex flex-col justify-between relative overflow-x-hidden">

    <header class="relative z-10 overflow-hidden border-b border-zinc-800/80 bg-gradient-to-b from-zinc-950 via-brand-dark to-brand-dark">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
            <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                <div class="flex flex-col sm:flex-row items-center gap-5 text-center sm:text-left">
                    <div class="w-24 h-24 sm:w-28 sm:h-28 bg-white rounded-2xl border-2 border-brand-500 p-1 flex items-center justify-center shadow-2xl overflow-hidden">
                        <img src="logo.jpg" alt="Logo Karang Taruna" class="w-full h-full object-contain">
                    </div>
                    <div>
                        <div class="flex items-center justify-center sm:justify-start gap-2 mb-1.5">
                            <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-950/90 border border-brand-800/80 text-brand-400 text-xs font-semibold">
                                <span class="w-2 h-2 rounded-full bg-brand-neon badge-pulse"></span> Database Publik Terhubung
                            </span>
                        </div>
                        <h1 class="text-2xl sm:text-4xl lg:text-5xl font-black tracking-tight uppercase leading-tight">
                            <span class="gradient-text">PANDU MUDA</span> <span class="text-white">SAWAHAN 5</span>
                        </h1>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="fetchDataFromSheet()" class="px-4 py-3 rounded-xl bg-zinc-900 border border-zinc-800 hover:border-zinc-700 text-zinc-300 hover:text-white font-semibold text-sm transition flex items-center gap-2">
                        <i class="fa-solid fa-rotate text-brand-500"></i> Refresh Data
                    </button>
                    <button onclick="exportDataCSV()" class="px-4 py-3 rounded-xl bg-zinc-900 border border-zinc-800 hover:border-zinc-700 text-zinc-300 hover:text-white font-semibold text-sm transition flex items-center gap-2">
                        <i class="fa-solid fa-file-csv text-emerald-500 text-lg"></i> Export CSV
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow space-y-8 w-full relative z-10">
        <!-- Statistik -->
        <section class="grid grid-cols-2 lg:grid-cols-5 gap-4">
            <div class="col-span-2 lg:col-span-1 glass-card p-5 rounded-2xl border border-zinc-800/90 flex items-center justify-between">
                <div>
                    <p class="text-xs text-zinc-400 font-bold tracking-wider uppercase">Total Pemuda/i</p>
                    <h3 id="statTotal" class="text-3xl font-black text-white mt-1">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-brand-950/80 border border-brand-800/50 flex items-center justify-center text-brand-500 text-xl">
                    <i class="fa-solid fa-users"></i>
                </div>
            </div>
            <div class="glass-card p-4 rounded-2xl border border-zinc-800/90 flex flex-col justify-between">
                <span class="text-xs text-zinc-400 font-bold uppercase">Sektor 01</span>
                <div class="mt-3"><span id="statSek1" class="text-2xl font-extrabold text-white">0</span> <span class="text-xs text-zinc-500">Jiwa</span></div>
            </div>
            <div class="glass-card p-4 rounded-2xl border border-zinc-800/90 flex flex-col justify-between">
                <span class="text-xs text-zinc-400 font-bold uppercase">Sektor 02</span>
                <div class="mt-3"><span id="statSek2" class="text-2xl font-extrabold text-white">0</span> <span class="text-xs text-zinc-500">Jiwa</span></div>
            </div>
            <div class="glass-card p-4 rounded-2xl border border-zinc-800/90 flex flex-col justify-between">
                <span class="text-xs text-zinc-400 font-bold uppercase">Sektor 03</span>
                <div class="mt-3"><span id="statSek3" class="text-2xl font-extrabold text-white">0</span> <span class="text-xs text-zinc-500">Jiwa</span></div>
            </div>
            <div class="glass-card p-4 rounded-2xl border border-zinc-800/90 flex flex-col justify-between">
                <span class="text-xs text-zinc-400 font-bold uppercase">Sektor 04</span>
                <div class="mt-3"><span id="statSek4" class="text-2xl font-extrabold text-white">0</span> <span class="text-xs text-zinc-500">Jiwa</span></div>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            <!-- Form Input -->
            <section class="lg:col-span-5 glass-card rounded-3xl border border-zinc-800/90 p-6 sm:p-8">
                <div class="mb-6 pb-4 border-b border-zinc-800/80">
                    <h2 class="text-xl font-black text-white flex items-center gap-2">
                        <i class="fa-solid fa-user-plus text-brand-500"></i> Pendataan Anggota Baru
                    </h2>
                </div>

                <form id="memberForm" onsubmit="handleFormSubmit(event)" class="space-y-5">
                    <div class="space-y-2">
                        <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider">Foto Selfie / Profil *</label>
                        <div class="flex items-center gap-4 bg-zinc-950/80 p-4 rounded-2xl border border-zinc-800">
                            <div class="relative w-20 h-20 rounded-2xl bg-zinc-900 border-2 border-dashed border-zinc-700 flex items-center justify-center overflow-hidden flex-shrink-0">
                                <img id="photoPreview" src="" class="hidden w-full h-full object-cover rounded-xl" alt="Preview">
                                <div id="photoPlaceholder" class="text-center p-2"><i class="fa-solid fa-camera text-xl text-zinc-600"></i></div>
                            </div>
                            <div class="flex-grow">
                                <label class="w-full px-3 py-2.5 bg-zinc-900 hover:bg-zinc-800 text-zinc-200 border border-zinc-700 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition cursor-pointer text-center">
                                    <i class="fa-solid fa-upload text-blue-400"></i> Pilih Foto
                                    <input type="file" id="photoFileInput" accept="image/*" onchange="handleFileUpload(event)" required class="hidden">
                                </label>
                                <input type="hidden" id="photoBase64" required>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider">Nama Lengkap *</label>
                        <input type="text" id="fullName" required placeholder="Contoh: Budi Santoso" class="w-full px-4 py-2.5 bg-zinc-950/80 border border-zinc-800 rounded-xl text-sm text-white focus:outline-none focus:border-brand-500">
                    </div>

                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider">Tanggal Lahir *</label>
                        <input type="date" id="birthDate" required class="w-full px-4 py-2.5 bg-zinc-950/80 border border-zinc-800 rounded-xl text-sm text-white focus:outline-none focus:border-brand-500">
                    </div>

                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider">Jenis Kelamin *</label>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="flex items-center justify-center gap-2 p-2.5 rounded-xl border border-zinc-800 bg-zinc-950/50 cursor-pointer">
                                <input type="radio" name="gender" value="Laki-laki" required class="accent-brand-500">
                                <span class="text-xs font-semibold text-zinc-200">Laki-laki</span>
                            </label>
                            <label class="flex items-center justify-center gap-2 p-2.5 rounded-xl border border-zinc-800 bg-zinc-950/50 cursor-pointer">
                                <input type="radio" name="gender" value="Perempuan" required class="accent-brand-500">
                                <span class="text-xs font-semibold text-zinc-200">Perempuan</span>
                            </label>
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider">Pekerjaan / Kegiatan *</label>
                        <select id="job" required class="w-full px-4 py-2.5 bg-zinc-950/80 border border-zinc-800 rounded-xl text-sm text-white focus:outline-none focus:border-brand-500">
                            <option value="" disabled selected>Pilih Pekerjaan...</option>
                            <option value="Pelajar / Mahasiswa">Pelajar / Mahasiswa</option>
                            <option value="Karyawan Swasta">Karyawan Swasta</option>
                            <option value="Wiraswasta / Usaha">Wiraswasta / Usaha</option>
                            <option value="Pegawai Negeri (PNS)">Pegawai Negeri (PNS)</option>
                            <option value="Freelancer / Kreatif">Freelancer / Kreatif</option>
                            <option value="Belum Bekerja">Belum Bekerja</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-1.5">
                            <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider">Sektor *</label>
                            <select id="sector" required class="w-full px-3 py-2.5 bg-zinc-950/80 border border-zinc-800 rounded-xl text-xs text-white">
                                <option value="" disabled selected>Pilih Sektor...</option>
                                <option value="Sektor 01">Sektor 01</option>
                                <option value="Sektor 02">Sektor 02</option>
                                <option value="Sektor 03">Sektor 03</option>
                                <option value="Sektor 04">Sektor 04</option>
                            </select>
                        </div>
                        <div class="space-y-1.5">
                            <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider">RT / RW</label>
                            <input type="text" id="rtRw" placeholder="RT 02 / RW 05" class="w-full px-3 py-2.5 bg-zinc-950/80 border border-zinc-800 rounded-xl text-xs text-white">
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full py-3.5 bg-gradient-to-r from-brand-600 to-rose-600 text-white font-extrabold text-sm rounded-xl transition">
                        Simpan & Kirim Data
                    </button>
                </form>
            </section>

            <!-- Tabel Data Publik -->
            <section class="lg:col-span-7 space-y-4">
                <div class="glass-card p-4 rounded-2xl border border-zinc-800/90 flex flex-col sm:flex-row gap-3 items-center justify-between">
                    <div class="relative w-full sm:w-64">
                        <input type="text" id="searchInput" oninput="renderTable()" placeholder="Cari nama anggota..." class="w-full pl-9 pr-4 py-2 bg-zinc-950/80 border border-zinc-800 rounded-xl text-xs text-white">
                        <i class="fa-solid fa-search absolute left-3 top-2.5 text-zinc-500 text-xs"></i>
                    </div>
                    <select id="filterSector" onchange="renderTable()" class="w-full sm:w-auto px-3 py-2 bg-zinc-950/80 border border-zinc-800 rounded-xl text-xs text-white">
                        <option value="ALL">Semua Sektor</option>
                        <option value="Sektor 01">Sektor 01</option>
                        <option value="Sektor 02">Sektor 02</option>
                        <option value="Sektor 03">Sektor 03</option>
                        <option value="Sektor 04">Sektor 04</option>
                    </select>
                </div>

                <div class="glass-card rounded-3xl border border-zinc-800/90 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs text-zinc-300">
                            <thead class="bg-zinc-950/90 text-zinc-400 uppercase font-bold border-b border-zinc-800">
                                <tr>
                                    <th class="p-4">Anggota</th>
                                    <th class="p-4">Umur</th>
                                    <th class="p-4">Sektor / RT</th>
                                    <th class="p-4">Pekerjaan</th>
                                </tr>
                            </thead>
                            <tbody id="memberTableBody" class="divide-y divide-zinc-800/60">
                                <tr><td colspan="4" class="p-6 text-center text-zinc-500">Memuat data dari server...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="border-t border-zinc-800/80 bg-zinc-950 py-6 text-center text-xs text-zinc-500 mt-12">
        <p>&copy; 2026 Karang Taruna Pandawa Lima - Padukuhan Sawahan 5.</p>
    </footer>

    <script>
        let members = [];
        const scriptURL = 'MASUKKAN_URL_WEB_APP_ANDA_DISINI'; // Ganti dengan URL deployment Web App Anda

        document.addEventListener("DOMContentLoaded", () => {
            fetchDataFromSheet();
        });

        async function fetchDataFromSheet() {
            try {
                const response = await fetch(scriptURL);
                const data = await response.json();
                members = Array.isArray(data) ? data : [];
                renderTable();
            } catch (error) {
                console.error("Gagal memuat data:", error);
                document.getElementById('memberTableBody').innerHTML = `<tr><td colspan="4" class="p-6 text-center text-red-400">Gagal memuat data dari server.</td></tr>`;
            }
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('photoBase64').value = e.target.result;
                    document.getElementById('photoPreview').src = e.target.result;
                    document.getElementById('photoPreview').classList.remove('hidden');
                    document.getElementById('photoPlaceholder').classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function calculateAge(birthDateStr) {
            if (!birthDateStr) return 0;
            const birthDate = new Date(birthDateStr);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
            return age;
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "Mengirim Data...";
            submitBtn.disabled = true;

            const payloadData = {
                id: Date.now(),
                photo: document.getElementById('photoBase64').value,
                fullName: document.getElementById('fullName').value,
                birthDate: document.getElementById('birthDate').value,
                gender: document.querySelector('input[name="gender"]:checked').value,
                job: document.getElementById('job').value,
                sector: document.getElementById('sector').value,
                rtRw: document.getElementById('rtRw').value || '-',
                createdAt: new Date().toISOString()
            };

            const bodyPayload = {
                action: 'create',
                payload: payloadData
            };

            try {
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyPayload)
                });
                
                alert("Data berhasil dikirim dan tersimpan di sistem publik!");
                document.getElementById('memberForm').reset();
                document.getElementById('photoPreview').classList.add('hidden');
                document.getElementById('photoPlaceholder').classList.remove('hidden');
                
                setTimeout(fetchDataFromSheet, 3000);
            } catch (error) {
                console.error('Error!', error.message);
                alert("Terjadi kesalahan saat mengirim data.");
            } finally {
                submitBtn.innerText = "Simpan & Kirim Data";
                submitBtn.disabled = false;
            }
        }

        function renderTable() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const sectorVal = document.getElementById('filterSector').value;
            const tbody = document.getElementById('memberTableBody');
            tbody.innerHTML = '';

            let filtered = members.filter(m => {
                const matchSearch = (m.name || '').toLowerCase().includes(searchVal);
                const matchSector = sectorVal === 'ALL' || m.sector === sectorVal;
                return matchSearch && matchSector;
            });

            document.getElementById('statTotal').innerText = members.length;
            document.getElementById('statSek1').innerText = members.filter(m => m.sector === 'Sektor 01').length;
            document.getElementById('statSek2').innerText = members.filter(m => m.sector === 'Sektor 02').length;
            document.getElementById('statSek3').innerText = members.filter(m => m.sector === 'Sektor 03').length;
            document.getElementById('statSek4').innerText = members.filter(m => m.sector === 'Sektor 04').length;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-zinc-500">Belum ada data anggota yang tercatat.</td></tr>`;
                return;
            }

            filtered.forEach(m => {
                const age = calculateAge(m.birthDate);
                tbody.innerHTML += `
                    <tr class="hover:bg-zinc-900/40 transition">
                        <td class="p-4 flex items-center gap-3">
                            <img src="${m.photo || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-xl object-cover border border-zinc-700" alt="Foto">
                            <div>
                                <p class="font-bold text-white">${m.name}</p>
                                <p class="text-[11px] text-zinc-500">${m.gender}</p>
                            </div>
                        </td>
                        <td class="p-4 font-semibold text-zinc-300">${age} Th</td>
                        <td class="p-4">
                            <span class="px-2 py-0.5 bg-brand-950 text-brand-400 border border-brand-800/60 rounded-md text-[11px] font-bold">${m.sector}</span>
                            <span class="block text-[10px] text-zinc-500 mt-0.5">${m.rtRw}</span>
                        </td>
                        <td class="p-4 text-zinc-300">${m.job}</td>
                    </tr>
                `;
            });
        }

        function exportDataCSV() {
            if (members.length === 0) {
                alert("Tidak ada data untuk diexport!");
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,ID,Nama,Tanggal Lahir,Jenis Kelamin,Pekerjaan,Sektor,RT/RW\n";
            members.forEach(m => {
                csvContent += `"${m.id || ''}","${m.name || ''}","${m.birthDate || ''}","${m.gender || ''}","${m.job || ''}","${m.sector || ''}","${m.rtRw || ''}"\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "rekap_data_sawahan5.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
